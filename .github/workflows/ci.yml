name: Repository CI

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: repository-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dependency-security:
    name: Dependency security
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Validate dependency tree
        run: npm ls --all

      - name: Audit dependencies
        run: npm audit --audit-level=high

      - name: Verify generated dependencies are not tracked
        shell: bash
        run: |
          if git ls-files --error-unmatch 'node_modules/**' >/dev/null 2>&1; then
            echo "::error::node_modules must not be tracked by Git"
            exit 1
          fi
